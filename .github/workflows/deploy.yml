name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deploys are blocked unless react-doctor scores a perfect 100.
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require react-doctor score 100
        run: |
          score=$(npx react-doctor . -y --score | tail -n 1)
          echo "react-doctor score: $score"
          if [ "$score" != "100" ]; then
            npx react-doctor . -y --verbose || true
            echo "::error::react-doctor score is $score; fix every issue until it reaches 100 before deploying."
            exit 1
          fi

  deploy:
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Joins the tailnet as an ephemeral tag:niskala-ci node; the VPS only accepts SSH from the tailnet.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:niskala-ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "deploy@$HOST" 'bash /srv/niskala-udara/deploy/deploy.sh'
